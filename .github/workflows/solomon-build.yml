name: "murmur build"

# Unsigned builds of this fork for macOS (Apple Silicon) and Windows, plus the
# Rust and frontend test suites. The macOS app is signed locally afterwards.
on:
  workflow_dispatch:
  push:
    branches: [solomon, overnight-8-nov]

concurrency:
  group: solomon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26 (Apple Intelligence)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The default Xcode on macos-15 has no FoundationModels SDK, so the
          # app was built with the Apple Intelligence stub and "Turn into a
          # prompt" never reached the model. Pick the newest Xcode 26.
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
            echo "Using $X"
          else
            echo "::warning::No Xcode 26 on this runner; Apple Intelligence will be built as a stub"
          fi
          xcodebuild -version
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: solomon-test-v1
      - run: bun install
      - name: Frontend checks
        run: |
          bun run lint
          bunx tsc --noEmit
      - name: Rust tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: set -o pipefail; cargo test 2>&1 | tail -150

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
      - uses: actions/checkout@v5
      - name: Use Xcode 26 (Apple Intelligence)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The default Xcode on macos-15 has no FoundationModels SDK, so the
          # app was built with the Apple Intelligence stub and "Turn into a
          # prompt" never reached the model. Pick the newest Xcode 26.
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
            echo "Using $X"
          else
            echo "::warning::No Xcode 26 on this runner; Apple Intelligence will be built as a stub"
          fi
          xcodebuild -version
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: solomon-${{ matrix.target }}-v1
          cache-bin: false
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install spirv-headers:x64-windows
          "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: bun install
      - name: Build
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          bun run tauri build ${{ matrix.args }} \
            --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
      - name: Check Apple Intelligence is built in
        if: runner.os == 'macOS'
        run: |
          BIN=src-tauri/target/${{ matrix.target }}/release/bundle/macos/murmur.app/Contents/MacOS/murmur
          if strings "$BIN" | grep -q "SDK requirement not met"; then
            echo "::warning::This build has the Apple Intelligence stub: Turn into a prompt will use the built-in formatter only"
          else
            echo "Apple Intelligence bridge is the real one"
          fi
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          ditto -c -k --keepParent murmur.app murmur-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: murmur-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # Installs the Windows build on a clean Windows runner and takes screenshots
  # of the first-run screen, the settings window and the recording bar.
  windows-screens:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: murmur-x86_64-pc-windows-msvc
          path: dist
      - name: Install, launch and screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "saved $name ($($b.Width)x$($b.Height))"
          }
          $setup = Get-ChildItem -Recurse dist -Filter *.exe | Select-Object -First 1
          Write-Host "installer: $($setup.FullName)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem -Recurse "$env:LOCALAPPDATA", "$env:ProgramFiles" -Filter murmur.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "murmur.exe not installed" }
          Write-Host "app: $($app.FullName)"
          # First run: onboarding.
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 25
          Shot "1-first-run"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process murmur -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          # Second run with onboarding done: the settings window.
          $dir = Join-Path $env:APPDATA "com.pais.handy"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $store = Join-Path $dir "settings_store.json"
          if (Test-Path $store) {
            $json = Get-Content $store -Raw | ConvertFrom-Json
            $json.settings.onboarding_completed = $true
            $json | ConvertTo-Json -Depth 32 | Set-Content $store -Encoding utf8
          } else {
            '{"settings":{"onboarding_completed":true}}' | Set-Content $store -Encoding utf8
          }
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 20
          Shot "2-settings"
          Start-Process $app.FullName -ArgumentList '--preview-overlay'
          Start-Sleep -Seconds 3
          Shot "3-recording-bar"
          Start-Process $app.FullName -ArgumentList '--preview-prompt-chip'
          Start-Sleep -Seconds 2
          Shot "4-prompt-choice"
          Get-Process murmur -ErrorAction SilentlyContinue | Stop-Process -Force
          $logs = Get-ChildItem -Recurse "$env:LOCALAPPDATA\com.pais.handy", "$env:APPDATA\com.pais.handy" -Filter *.log -ErrorAction SilentlyContinue
          foreach ($l in $logs) { Copy-Item $l.FullName shots/ }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screens
          path: shots
          retention-days: 14
